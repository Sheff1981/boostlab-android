name: Android CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test server control API
        run: python3 -m unittest discover -s server/tests -v
      - name: Build debug APK (runner-specific signing; not upgradeable)
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: boostlab-dev-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Check release signing availability
        env:
          SIGNING_KEY: ${{ secrets.BOOSTLAB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then echo "HAS_SIGNING_KEY=true" >> "$GITHUB_ENV"; fi
      - name: Build stable signed release APK
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          echo "$BOOSTLAB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/boostlab-release.jks"
          export BOOSTLAB_KEYSTORE_PATH="$RUNNER_TEMP/boostlab-release.jks"
          gradle --no-daemon :app:assembleRelease
          rm -f "$BOOSTLAB_KEYSTORE_PATH"
        env:
          BOOSTLAB_KEYSTORE_BASE64: ${{ secrets.BOOSTLAB_KEYSTORE_BASE64 }}
          BOOSTLAB_KEYSTORE_PASSWORD: ${{ secrets.BOOSTLAB_KEYSTORE_PASSWORD }}
          BOOSTLAB_KEY_ALIAS: ${{ secrets.BOOSTLAB_KEY_ALIAS }}
          BOOSTLAB_KEY_PASSWORD: ${{ secrets.BOOSTLAB_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        with:
          name: boostlab-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
