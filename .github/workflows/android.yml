name: Android CI
# Stable signing enabled via repository secret

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BOOSTLAB_SIGNING_PASSWORD: ${{ secrets.BOOSTLAB_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK
        run: android sdk install platform-tools platforms/android-37 build-tools/36.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare build version
        run: |
          echo "BOOSTLAB_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "BOOSTLAB_VERSION_NAME=0.10.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build and test
        run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Require stable signing on manual release
        if: github.event_name == 'workflow_dispatch' && env.BOOSTLAB_SIGNING_PASSWORD == ''
        run: |
          echo "::error::BOOSTLAB_SIGNING_PASSWORD is not configured. Refusing to publish an unsigned/ephemeral customer build."
          exit 1

      - name: Prepare stable signing
        if: env.BOOSTLAB_SIGNING_PASSWORD != ''
        run: |
          test -f ci/boostlab-update.p12.b64
          base64 --decode ci/boostlab-update.p12.b64 > "$RUNNER_TEMP/boostlab-update.p12"
          keytool -list             -storetype PKCS12             -keystore "$RUNNER_TEMP/boostlab-update.p12"             -storepass "$BOOSTLAB_SIGNING_PASSWORD"             -alias boostlab >/dev/null
          echo "BOOSTLAB_SIGNING_STORE_FILE=$RUNNER_TEMP/boostlab-update.p12" >> "$GITHUB_ENV"

      - name: Build stable signed APK
        if: env.BOOSTLAB_SIGNING_PASSWORD != ''
        run: gradle :app:assembleRelease

      - name: Verify stable APK signature
        if: env.BOOSTLAB_SIGNING_PASSWORD != ''
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.boostlab.app'" "$RUNNER_TEMP/badging.txt"
          CERT_SHA256=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test -n "$CERT_SHA256"
          echo "BOOSTLAB_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

      - name: Publish stable APK file
        if: env.BOOSTLAB_SIGNING_PASSWORD != ''
        run: |
          cp app/build/outputs/apk/release/app-release.apk BOOSTLAB-stable-latest.apk
          sha256sum BOOSTLAB-stable-latest.apk > BOOSTLAB-stable-latest.apk.sha256
          printf '%s  %s\n' "$BOOSTLAB_CERT_SHA256" "signing-certificate-sha256" > BOOSTLAB-stable-latest.cert.sha256

      - name: Upload stable APK
        if: env.BOOSTLAB_SIGNING_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: boostlab-android-stable
          path: |
            BOOSTLAB-stable-latest.apk
            BOOSTLAB-stable-latest.apk.sha256
            BOOSTLAB-stable-latest.cert.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: boostlab-android-debug-ephemeral-signature
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
