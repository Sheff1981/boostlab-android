<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOOSTLAB ADMIN</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial;background:#0d1320;color:#eaf1fa}
body{max-width:1100px;margin:32px auto;padding:0 18px}
h1{letter-spacing:.07em;color:#6ee7dc}p{color:#a9b9cd}
input,button{padding:13px;border-radius:10px;border:1px solid #3b5065;background:#19283a;color:white;font:inherit}
button{background:#167c7c;cursor:pointer}button:hover{background:#219a94}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
input{flex:1;min-width:240px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card{background:#182638;border:1px solid #293e53;border-radius:14px;padding:22px}
.card strong{display:block;font-size:2.2rem;margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:18px}
th,td{text-align:left;padding:13px;border-bottom:1px solid #334558}
th{color:#9cbbd2}
#status{min-height:22px}
@media(max-width:650px){table{font-size:12px}th,td{padding:7px}}
</style></head><body>
<h1>BOOSTLAB ADMIN</h1><p>Управление зарегистрированными VPN-устройствами. Статистика подключений будет добавлена после интеграции WireGuard.</p>
<div class="controls"><input id="token" type="password" autocomplete="off" placeholder="Администраторский токен"><button id="load">Обновить</button></div>
<p id="status" role="status"></p>
<div class="cards"><div class="card">Зарегистрировано<strong id="total">—</strong></div><div class="card">Разрешён доступ<strong id="enabled">—</strong></div></div>
<h2>Устройства</h2><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Телефон</th><th>Адрес VPN</th><th>Осталось</th><th>Статус</th></tr></thead><tbody id="devices"></tbody></table></div>
<script>
document.getElementById('load').onclick=async()=>{
const token=document.getElementById('token').value;
const status=document.getElementById('status');
if(!token){status.textContent='Введите токен администратора';return}
status.textContent='Загрузка…';
try{
const options={headers:{Authorization:'Bearer '+token},cache:'no-store'};
const [a,b]=await Promise.all([fetch('/admin/summary',options),fetch('/admin/devices',options)]);
if(!a.ok||!b.ok)throw Error('Ошибка авторизации или сервера: '+a.status+'/'+b.status);
const summary=await a.json(),list=await b.json();
document.getElementById('total').textContent=summary.total_devices;
document.getElementById('enabled').textContent=summary.enabled_devices;
const tbody=document.getElementById('devices');tbody.replaceChildren();
for(const d of list.devices){
const tr=document.createElement('tr');
for(const value of [d.id,(d.manufacturer+' '+d.model).trim()||'Неизвестно',d.vpn_ip,d.days_remaining+' дней',d.enabled&&d.days_remaining>0?'Активна':'Нет доступа']){
const td=document.createElement('td');td.textContent=value;tr.append(td)}
tbody.append(tr)}
status.textContent='Данные обновлены';
}catch(e){status.textContent=e.message}
};
</script></body></html>
